<script>window.onerror=function(m,s,l){var e=document.getElementById("err");e.style.display="block";if(e.textContent.indexOf(m)<0)e.textContent+="Erro: "+m+" (linha "+l+")\n"};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.onerror('Nao carregou o Three.js (internet ou bloqueio do CDN)','',0)"></script>
<script>
const T=THREE,cv=document.getElementById('c'),hud=document.getElementById('hud'),ov=document.getElementById('ov'),cx2=ov.getContext('2d'),fe=document.getElementById('fl'),gbtn=document.getElementById('grab');
const R=new T.WebGLRenderer({canvas:cv,antialias:devicePixelRatio<2});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));
const sc=new T.Scene();sc.background=new T.Color(0x8fb4e8);sc.fog=new T.Fog(0xe9dcc4,150,1300);
const cam=new T.PerspectiveCamera(70,1,.6,2600);
function rs(){ov.width=innerWidth;ov.height=innerHeight;R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

// Fase 1: arena (chao, grid, predios)
sc.add(new T.HemisphereLight(0xcfe0ff,0x665544,.72));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(60,100,40);sc.add(sun);
const fl=new T.Mesh(new T.PlaneGeometry(3200,3200),new T.MeshLambertMaterial({color:0xb98d56,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2}));
fl.rotation.x=-Math.PI/2;sc.add(fl);
const gr=new T.GridHelper(3200,640,0x7c808a,0x969aa4);gr.position.y=.06;gr.visible=false;sc.add(gr);
const mats=[0x9a7650,0x84603f,0xb08a5c].map(c=>new T.MeshLambertMaterial({color:c}));
let seed=12345;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const boxes=[];
for(let i=0;i<170;i++){
  const w=6+rnd()*16,d=6+rnd()*16,h=4+rnd()*rnd()*55,x=(rnd()-.5)*1400,z=(rnd()-.5)*1400;
  if(Math.hypot(x,z-30)<22)continue;
  const m=new T.Mesh(new T.BoxGeometry(w,h,d),mats[i%3]);m.position.set(x,h/2,z);sc.add(m);
  boxes.push({m,col:mats[i%3].color,x0:x-w/2,x1:x+w/2,y0:0,y1:h,z0:z-d/2,z1:z+d/2});
}

// Jogador
const pl=new T.Mesh(new T.BoxGeometry(.8,1.8,.6),new T.MeshLambertMaterial({color:0xff5a1f,emissive:0x331000}));
sc.add(pl);
const p=pl.position,v=new T.Vector3(),RAD=1;
let yaw=0,pitch=-.15,dashT=0,dashCd=0,fov=70;

// Fase 2: rastro em fita (sempre de frente para a camera, afina na ponta)
let sf=0;const N=110,LIFE=1.3,tp=[],pool=[],tg=new T.BufferGeometry();
tg.setAttribute('position',new T.BufferAttribute(new Float32Array(N*6),3));
const ix=[];for(let i=0;i<N-1;i++){const a=2*i;ix.push(a,a+1,a+2,a+1,a+3,a+2)}
tg.setIndex(ix);
const tr=new T.Mesh(tg,new T.MeshBasicMaterial({color:0xffffff,side:T.DoubleSide,fog:false}));
tr.frustumCulled=false;sc.add(tr);
const A=new T.Vector3(),B=new T.Vector3(),S=new T.Vector3();
function trail(){
  sf+=(Math.min(Math.max((v.length()-5)/30,0),1)-sf)*(1-Math.exp(-10*H));
  for(const q of tp)q.age+=H;
  while(tp.length&&tp[tp.length-1].age>LIFE)pool.push(tp.pop());
  if(sf>.02&&(!tp.length||tp[0].distanceTo(p)>.5)){
    const q=pool.pop()||new T.Vector3();q.copy(p);q.age=0;tp.unshift(q);if(tp.length>N)pool.push(tp.pop());
  }
  if(!(tr.visible=tp.length>0))return;
  const L=tp.length,a=tg.attributes.position.array,g=i=>i?tp[Math.min(i-1,L-1)]:p;
  for(let i=0;i<N;i++){
    const c=g(i);A.subVectors(c,g(i+1));B.subVectors(cam.position,c);
    S.crossVectors(A,B);const l=S.length();
    if(l<1e-6)S.set(0,.3*sf,0);else S.multiplyScalar(.9*sf*(1+tier*1.2)*(1-(c.age||0)/LIFE)/l);
    const o=i*6;
    a[o]=c.x-S.x;a[o+1]=c.y-S.y;a[o+2]=c.z-S.z;a[o+3]=c.x+S.x;a[o+4]=c.y+S.y;a[o+5]=c.z+S.z;
  }
  tg.attributes.position.needsUpdate=true;
}

// Fase 3: impacto estilo anime (hit-stop, impact frame, tremor, onda de choque, fumaca, entulho, som)
const Hp=new T.Vector3(),PT=new T.Vector3(),SV=new T.Vector3(),SH=new T.Vector3();
let calm=false,ivr=false,tier=0,wasF=false,dashBtn=false,mt=0,slowT=0,score=0,rg=0,held=null,hold=0,impT=0,trauma=0,hitCd=0,spd=0,ipx=0,ipy=0,fc=0,was=false;
let VMAX=260;const msg=document.getElementById('msg'),spn=document.getElementById('spn');
function vib(p){try{if(navigator.vibrate&&!calm)navigator.vibrate(p)}catch(e){}}
function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>{msg.style.opacity=0},1800)}
let ac,gest=false;
addEventListener('pointerdown',()=>{gest=true},true);addEventListener('keydown',()=>{gest=true},true);
const aud=()=>{if(!gest)return null;ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function noi(dur,g,f0,f1){
  const c=aud();if(!c)return;
  const t=c.currentTime,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),o=c.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);o.gain.value=g;
  s.connect(f);f.connect(o);o.connect(c.destination);s.start(t);
}
function boom(pw){
  const c=aud();if(!c)return;
  const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(28,t+.6);
  g.gain.setValueAtTime(pw,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.7);noi(.5,.9*pw,3000,120);
}
const whoosh=()=>noi(.35,.35,500+spd*6,2500+spd*15);
// ondas de choque
const rings=[];let ri=0;
for(let i=0;i<4;i++){
  const m=new T.Mesh(new T.RingGeometry(.8,1,40),new T.MeshBasicMaterial({color:0xffffff,transparent:true,side:T.DoubleSide,depthWrite:false,fog:false}));
  m.visible=false;m.t=9;sc.add(m);rings.push(m);
}
function ring(pt,n,sz){const m=rings[ri++%4];m.position.copy(pt);m.lookAt(Hp.copy(pt).add(n));m.t=0;m.sz=sz;m.visible=true}
// fumaca (sprites com textura gerada em canvas)
const sg=document.createElement('canvas');sg.width=sg.height=64;
const g2=sg.getContext('2d'),gd=g2.createRadialGradient(32,32,2,32,32,32);
gd.addColorStop(0,'rgba(255,255,255,.9)');gd.addColorStop(1,'rgba(255,255,255,0)');g2.fillStyle=gd;g2.fillRect(0,0,64,64);
const stx=new T.CanvasTexture(sg),puffs=[];let pi=0;
for(let i=0;i<80;i++){
  const s=new T.Sprite(new T.SpriteMaterial({map:stx,color:0x9a9aa2,transparent:true,depthWrite:false,opacity:0}));
  s.visible=false;s.vel=new T.Vector3();s.t=9;s.life=1;s.sz=1;sc.add(s);puffs.push(s);
}
function puff(pt,sz,up){
  const s=puffs[pi++%80];s.position.copy(pt);s.vel.set((Math.random()-.5)*sz*1.2,Math.random()*sz*.5+up,(Math.random()-.5)*sz*1.2);
  s.t=0;s.life=(sz>8?2.6:1.2)+Math.random()*1.5;s.sz=sz*(.7+Math.random()*.6);s.visible=true;
}
// entulho (InstancedMesh, fisica propria leve)
const DN=480,dm=new T.InstancedMesh(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({color:0xffffff}),DN);
const DQ=new T.Quaternion(),DS=new T.Vector3(),DM=new T.Matrix4(),WHT=new T.Color(1,1,1),db=[];let di=0;
dm.instanceMatrix.setUsage(T.DynamicDrawUsage);dm.frustumCulled=false;sc.add(dm);
for(let i=0;i<DN;i++){
  db.push({p:new T.Vector3(),v:new T.Vector3(),r:new T.Euler(),w:new T.Vector3(),s:1,life:0,z:false});
  DM.makeScale(0,0,0);dm.setMatrixAt(i,DM);dm.setColorAt(i,WHT);
}
function chunk(x,y,z,s,vx,vy,vz,col){
  const i=di,d=db[i];di=(di+1)%DN;
  d.p.set(x,y,z);d.v.set(vx,vy,vz);d.w.set((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14);
  d.r.set(Math.random()*6,Math.random()*6,Math.random()*6);d.s=s;d.life=40+Math.random()*25;d.z=false;
  dm.setColorAt(i,col);dm.instanceColor.needsUpdate=true;
}
const R90=a=>Math.round(a/1.5708)*1.5708;
function debris(){
  for(let i=0;i<DN;i++){
    const d=db[i];if(d.life<=0)continue;
    d.life-=H;
    if(d.life<=0){DM.makeScale(0,0,0);dm.setMatrixAt(i,DM);continue}
    if(d.z){if(d.life<.8){DQ.setFromEuler(d.r);DS.setScalar(d.s*d.life/.8);DM.compose(d.p,DQ,DS);dm.setMatrixAt(i,DM)}continue}
    d.v.y-=32*H;d.p.addScaledVector(d.v,H);
    if(d.p.y<d.s*.5){
      d.p.y=d.s*.5;
      if(d.v.y<-12&&Math.random()<.15)puff(d.p,3,1);
      if(d.v.y<0)d.v.y*=-.35;
      d.v.x*=.8;d.v.z*=.8;d.w.multiplyScalar(.7);
      if(Math.abs(d.v.y)<2&&Math.hypot(d.v.x,d.v.z)<1.5){d.z=true;d.r.set(R90(d.r.x),R90(d.r.y),R90(d.r.z));d.v.set(0,0,0);d.w.set(0,0,0)}
    }
    d.r.x+=d.w.x*H;d.r.y+=d.w.y*H;d.r.z+=d.w.z*H;
    DQ.setFromEuler(d.r);DS.setScalar(d.s*Math.min(1,d.life/.8));DM.compose(d.p,DQ,DS);dm.setMatrixAt(i,DM);
  }
  dm.instanceMatrix.needsUpdate=true;
}
// predio vira pedacos que voam para longe do ponto de impacto
function smash(b,pt,sp){
  b.m.visible=false;boxes.splice(boxes.indexOf(b),1);
  const w=b.x1-b.x0,h=b.y1-b.y0,d=b.z1-b.z0,c=Math.max(2.6,Math.cbrt(w*h*d/60));
  for(let i=0;i<10;i++)puff(SV.set(b.x0+Math.random()*w,b.y0+Math.random()*h*.6,b.z0+Math.random()*d),14,3);
  const nx=Math.ceil(w/c),ny=Math.ceil(h/c),nz=Math.ceil(d/c);
  for(let a=0;a<nx;a++)for(let e=0;e<ny;e++)for(let f=0;f<nz;f++){
    const x=b.x0+(a+.5)*w/nx,y=b.y0+(e+.5)*h/ny,z=b.z0+(f+.5)*d/nz;
    SV.set(x-pt.x,y-pt.y,z-pt.z);const l=SV.length()+.5;
    SV.multiplyScalar(sp*.45*Math.max(.15,1-l/70)/l);
    chunk(x,y,z,c*(.7+Math.random()*.4),SV.x+v.x*.3+(Math.random()-.5)*6,SV.y+6+Math.random()*6,SV.z+v.z*.3+(Math.random()-.5)*6,b.col);
  }
}
const scars=[];let si=0;
for(let i=0;i<70;i++){
  const m=new T.Mesh(new T.CircleGeometry(1,16),new T.MeshBasicMaterial({color:0,transparent:true,opacity:0,depthWrite:false,fog:false}));
  m.rotation.x=-Math.PI/2;m.visible=false;m.t=0;sc.add(m);scars.push(m);
}
function scar(pt,sz){const m=scars[si++%70];m.position.set(pt.x,.1,pt.z);m.scale.setScalar(sz||5+Math.random()*3);m.t=0;m.visible=true}
// impacto: retorna true se o predio foi destruido (own=false: arremesso de alvo)
function hit(b,pt,n,sp,own=true){
  if(hitCd>0)return false;
  hitCd=.25;const T0=b?(b.T||(b.T=45+Math.cbrt((b.x1-b.x0)*(b.y1-b.y0)*(b.z1-b.z0))*2.2)):60,big=sp>=T0;
  if(b&&!big&&own&&sp>25)say('Resiste: precisa de '+Math.ceil(T0)+' de velocidade');
  Hp.copy(pt).project(cam);ipx=(Hp.x*.5+.5)*ov.width;ipy=(.5-Hp.y*.5)*ov.height;
  trauma=Math.min(1,trauma+(big?1:sp/120));hold=big?.14:.04;impT=big&&!calm?.07:0;ivr=Math.random()<.4;fov-=big?12:3;vib(big?[40,30,60]:15);
  ring(pt,n,big?24:8);
  for(let i=0;i<(big?30:5);i++)puff(pt,big?15:5,big?4:1);
  boom(big?1:.25);if(big){fire(pt,36);sphereBlast(pt,30)}
  if(big){
    slowT=.5;fe.style.transition='none';fe.style.opacity=calm?0:.85;fe.offsetWidth;fe.style.transition='opacity .35s';fe.style.opacity=0;
    scar(pt);
    for(let i=0;i<24;i++)chunk(pt.x,pt.y,pt.z,.25+Math.random()*.4,(Math.random()-.5)*50+n.x*20,Math.random()*30+n.y*20,(Math.random()-.5)*50+n.z*20,b?b.col:WHT);
  }
  if(own&&sp>20)dashT=0;
  if(held&&own&&sp>35){held.hp--;fire(held.g.position,10);if(held.hp<=0){const f=held;held=null;gbtn.textContent='Agarrar';f.st='dead';f.g.visible=false;score++;fire(f.g.position,16);setTimeout(()=>spawnFoe(f),4000)}}
  if(big&&b){smash(b,pt,Math.min(sp,140));if(own)v.multiplyScalar(.6);return true}
  return false;
}
function fx(){
  for(const m of rings)if(m.visible){m.t+=H;const k=m.t/.4;if(k>=1)m.visible=false;else{m.scale.setScalar(2+k*m.sz);m.material.opacity=1-k}}
  for(const s of puffs)if(s.visible){
    s.t+=H;const k=s.t/s.life;
    if(k>=1)s.visible=false;
    else{s.position.addScaledVector(s.vel,H);s.vel.multiplyScalar(1-1.5*H);s.scale.setScalar(s.sz*(.4+k*1.6));s.material.opacity=.75*(1-k)}
  }
  debris();foesStep();hoopsStep();bhStep();fbStep();shotsStep();bossStep();vxStep();beamStep();arcStep();dbStep();bsh.position.set(p.x,.12,p.z);bsh.material.opacity=Math.max(0,.4-p.y*.008);bsh.scale.setScalar(1.2+p.y*.03);gbub.visible=bhT>0;if(bhT>0){gbub.position.copy(p);gbub.scale.setScalar(1+Math.sin(bhT*10)*.05)}
  for(const m of scars)if(m.visible){m.t+=H;if(m.t>10)m.visible=false;else m.material.opacity=.4*Math.min(1,(10-m.t)/3)}
}
// overlay 2D: linhas de velocidade e impact frame (preto com linhas brancas radiais)
function ray(n,x,y,r0,col,aw){
  const far=Math.hypot(ov.width,ov.height);cx2.fillStyle=col;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,w=aw*(.3+Math.random()),r=r0*(1+Math.random()*.6);
    cx2.beginPath();cx2.moveTo(x+Math.cos(a-w)*far,y+Math.sin(a-w)*far);
    cx2.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);cx2.lineTo(x+Math.cos(a+w)*far,y+Math.sin(a+w)*far);cx2.fill();
  }
}
function drawOv(){
  const w=ov.width,h=ov.height,hi=impT>0;

function rayBox(o,d,b){
  let t0=0,t1=1e9;
  const q=[[o.x,d.x,b.x0,b.x1],[o.y,d.y,b.y0,b.y1],[o.z,d.z,b.z0,b.z1]];
  for(const [oo,dd,lo,hi] of q){
    if(Math.abs(dd)<1e-6){if(oo<lo||oo>hi)return -1}
    else{let a=(lo-oo)/dd,c=(hi-oo)/dd;if(a>c){const t=a;a=c;c=t}t0=Math.max(t0,a);t1=Math.min(t1,c);if(t0>t1)return -1}
  }
  return t0;
}

// Entrada: celular (joystick a esquerda, arrastar a direita) e PC (WASD, mouse, Espaco)
const K={},stick={x:0,y:0},P={};
const sk=document.getElementById('stick'),kn=document.getElementById('knob');
addEventListener('keydown',e=>{
  K[e.code]=1;
  if(e.code==='KeyR')reset();
  if(e.code==='KeyE'||e.code==='KeyG')grab();
  if(e.code==='KeyQ'||e.code==='KeyF')bhSpawn();

});
addEventListener('keyup',e=>{K[e.code]=0});
cv.addEventListener('pointerdown',e=>{
  aud();cv.setPointerCapture(e.pointerId);
  const mov=e.pointerType!=='mouse'&&e.clientX<innerWidth*.45;
  P[e.pointerId]={t:mov?'mov':'cam',sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};
  if(mov){
    sk.style.display=kn.style.display='block';
    sk.style.left=kn.style.left=e.clientX+'px';sk.style.top=kn.style.top=e.clientY+'px';
  }
});
cv.addEventListener('pointermove',e=>{
  const q=P[e.pointerId];if(!q)return;
  if(q.t==='cam'){
    yaw-=(e.clientX-q.x)*.006;
    pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-q.y)*.006));
  }
  q.x=e.clientX;q.y=e.clientY;
  if(q.t==='mov'){
    let dx=q.x-q.sx,dy=q.y-q.sy;const l=Math.hypot(dx,dy),m=Math.min(l,55);
    if(l>0){dx*=m/l;dy*=m/l}
    stick.x=dx/55;stick.y=-dy/55;
    kn.style.left=q.sx+dx+'px';kn.style.top=q.sy+dy+'px';
  }
});
function up(e){
  const q=P[e.pointerId];if(!q)return;
  if(q.t==='mov'){stick.x=stick.y=0;sk.style.display=kn.style.display='none'}
  delete P[e.pointerId];
}

  if(walk){if(jumps<2){jumps++;v.y=30;dashCd=.25;vib(10)}return}
  const s=Math.min(VMAX,Math.max(v.length(),40)+(ssj?60:42));
  v.multiplyScalar(.25).addScaledVector(F,s).setLength(s);
  dashT=.15;dashCd=.14;fov+=5;whoosh();trauma=Math.max(trauma,.1+s/900);
}
function reset(){

// Simulacao em passo fixo de 60 Hz
const F=new T.Vector3(),Rt=new T.Vector3(),W=new T.Vector3(),M=new T.Matrix4(),Q=new T.Quaternion();
const UP=new T.Vector3(0,1,0),ZERO=new T.Vector3(),H=1/60;
function step(){
  if(lock){
    const tg=BS.st!=='dead'?bp:(VX.st!=='dead'?vp:null);
    if(tg){
      const dx=tg.x-p.x,dz=tg.z-p.z,ty=(tg===bp?14:tg.y)-p.y;let da=Math.atan2(-dx,-dz)-yaw;da=Math.atan2(Math.sin(da),Math.cos(da));
      yaw+=da*Math.min(1,4*H);pitch+=(Math.max(-1,Math.min(1,Math.atan2(ty,Math.hypot(dx,dz))))*.8-pitch)*Math.min(1,3*H);
    }
  }
  const cp=Math.cos(pitch);
  F.set(-Math.sin(yaw)*cp,Math.sin(pitch),-Math.cos(yaw)*cp);
  Rt.set(Math.cos(yaw),0,-Math.sin(yaw));
  let mx=stick.x+(K.KeyD?1:0)-(K.KeyA?1:0),my=stick.y+(K.KeyW?1:0)-(K.KeyS?1:0);
  const il=Math.hypot(mx,my);if(il>1){mx/=il;my/=il}
  dashCd-=H;
  dashT-=H;
  if(slamT>0)slamStep();else{
  if((K.Space||K.ShiftLeft||dashBtn)&&dashCd<=0)dash();
  if(walk)walkStep(mx,my);
  else{
  W.copy(F).multiplyScalar(my*36).addScaledVector(Rt,mx*36);
  const s0=v.length();
  if(s0>40){
    if(Math.hypot(mx,my)>.1){SV.copy(W).setLength(s0);v.lerp(SV,1-Math.exp(-2.2*H));v.setLength(s0)}
    v.multiplyScalar(1-.45*H);v.y-=16*H;
  }else v.lerp(W,1-Math.exp(-3.5*H));
  }
  if(v.length()>VMAX)v.setLength(VMAX);
  }
  const ns=Math.max(1,Math.ceil(v.length()*H/.6));
  for(let ss=0;ss<ns;ss++){
  p.addScaledVector(v,H/ns);
  p.x=Math.max(-1400,Math.min(1400,p.x));p.z=Math.max(-1400,Math.min(1400,p.z));
  if(p.y<RAD){p.y=RAD;if(v.y<-10){PT.set(p.x,0,p.z);hit(null,PT,UP,-v.y)}if(slamT>0&&slamB>0&&v.y<-15){slamB--;v.y=-v.y*.45;PT.set(p.x,.5,p.z);for(let i=0;i<10;i++)puff(PT,12,3);ring(PT,UP,30);boom(.6)}else if(v.y<0)v.y=0}
  for(let bi=boxes.length-1;bi>=0;bi--){const b=boxes[bi];
    const cx=Math.max(b.x0,Math.min(p.x,b.x1)),cy=Math.max(b.y0,Math.min(p.y,b.y1)),cz=Math.max(b.z0,Math.min(p.z,b.z1));
    A.set(p.x-cx,p.y-cy,p.z-cz);const d2=A.lengthSq();
    if(d2>=RAD*RAD)continue;
    if(d2>1e-8){const d=Math.sqrt(d2);A.divideScalar(d);p.addScaledVector(A,RAD-d)}
    else{A.set(0,1,0);p.y=b.y1+RAD}
    const vn=v.dot(A);
    if(vn<-10){PT.set(cx,cy,cz);if(hit(b,PT,A,-vn))continue}
    if(vn<0){
      v.addScaledVector(A,-vn);
      if(dashT>0&&vn<-20)dashT=0; // fase 3: aqui entra a destruicao (vn = forca do impacto)
    }
  }}
  const sp=v.length();
  const k=walk?0:Math.min(Math.max((sp-8)/22,0),1);
  if(sp>.5)Hp.copy(v).divideScalar(sp);else Hp.copy(UP);
  SV.copy(UP).lerp(Hp,k).normalize();
  Q.setFromUnitVectors(UP,SV);DQ.setFromAxisAngle(UP,yaw);Q.multiply(DQ);
  pl.quaternion.slerp(Q,1-Math.exp(-10*H));
  W.copy(p).addScaledVector(F,-(7.5+sp*.03));W.y+=2;
  for(let t=1;t>0;t-=.2){SV.copy(p).lerp(W,t);if(!boxes.some(b=>SV.x>b.x0-.8&&SV.x<b.x1+.8&&SV.y<b.y1+.8&&SV.z>b.z0-.8&&SV.z<b.z1+.8)){W.copy(SV);break}}
  cam.position.lerp(W,1-Math.exp(-(14+sp*.06)*H));cam.position.y=Math.max(cam.position.y,.6);
  cam.lookAt(p.x,p.y+.6,p.z);
  fov+=(68+Math.min(sp,VMAX)*.16+(dashT>0?6:0)-fov)*(1-Math.exp(-6*H));
  cam.fov=fov;cam.updateProjectionMatrix();
  trail();fx();spd=sp;hitCd-=H;
  sky.position.copy(cam.position);
  tier=Math.min(1,Math.max(0,(sp-40)/220));
  if(dashT>0)tr.material.color.setHex(0xff7a1a);else tr.material.color.setHSL(.55-.43*tier,tier,1-.4*tier);
  pl.scale.set(1-tier*.15,1+tier*.6,1-tier*.15);
  const fast=sp>=150;
  if(fast&&!wasF){ring(p,F,30);for(let i=0;i<6;i++)puff(p,6,2);trauma=Math.min(1,trauma+.35);boom(.35)}
  wasF=fast;if(sp>150)trauma=Math.max(trauma,(sp-150)/500);
}
let last=performance.now(),acc=0,fr=0,ft=0,ts=1,ldE=document.getElementById('ld'),prx=Math.min(devicePixelRatio,1.5);
function loop(t){
  requestAnimationFrame(loop);
  if(document.hidden){last=performance.now();return}
  const tn=performance.now(),rd=Math.max(0,Math.min((tn-last)/1000,.1));last=tn;slowT-=rd;ts+=((slowT>0?.3:1)-ts)*(1-Math.exp(-9*rd));const d=rd*ts;acc+=d;
  while(acc>=H){acc-=H;if(impT>0)impT-=H;if(hold>0)hold-=H;else{try{step()}catch(e){window.onerror(e.message,'',0);acc=0;break}}}
  trauma=Math.max(0,trauma-d*1.8);
  const sh=trauma*trauma*1.2;SH.set((Math.random()-.5)*sh,(Math.random()-.5)*sh,(Math.random()-.5)*sh);
  cam.position.add(SH);R.render(sc,cam);cam.position.sub(SH);drawOv();if(ldE){ldE.remove();ldE=null}spn.textContent=Math.round(spd);spn.style.color=spd>150?'#ffd24a':spd>90?'#7fe3ff':'#fff';
  fr++;ft+=rd;
  if(ft>=.5){const f0=fr/ft;if(f0<40&&prx>.6){prx-=.15;R.setPixelRatio(prx);R.setSize(innerWidth,innerHeight,false)}else if(f0>57&&prx<Math.min(devicePixelRatio,1.5)){prx+=.1;R.setPixelRatio(prx);R.setSize(innerWidth,innerHeight,false)}hud.textContent='Alvos '+score+'   Aneis '+rg+'   '+Math.round(fr/ft)+' FPS   '+R.info.render.calls+' draw calls';fr=0;ft=0}
}
reset();requestAnimationFrame(loop);
